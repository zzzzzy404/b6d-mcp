[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "b6d-mcp"
# 中文注释：与 .codex-plugin/plugin.json 的 version 保持一致（有测试检查）
version = "0.1.0"
description = "b6d MCP 服务：让 Codex 调用 b6d 生成图片/视频、管理素材、预览短剧工作台"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
b6d-mcp = "b6d_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/b6d_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
